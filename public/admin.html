<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Lumma | Calendario privado</title><link rel="stylesheet" href="/styles.css"/></head>
<body><main class="shell"><section class="brand"><div class="logo">L</div><div><h1>lumma</h1><p>calendario privado · admin</p></div></section><section class="card admin-card"><div id="login"><span class="eyebrow">ACCESO PRIVADO</span><h2>Tu calendario</h2><p>Solo tú puedes ver los datos de las personas registradas.</p><input id="password" type="password" placeholder="Contraseña"/><button id="loginBtn">Entrar</button><p id="loginMsg" class="message"></p></div><div id="panel" hidden><div class="admin-head"><div><span class="eyebrow">LUMMA</span><h2>Citas agendadas</h2></div><button class="secondary" id="refresh">Actualizar</button></div><div id="appointments"></div></div></section><footer>Lumma · Hairstyle, Nails and Pedi</footer></main><script>
let token='';const login=document.querySelector('#login'),panel=document.querySelector('#panel'),box=document.querySelector('#appointments');function msg(t,c='error'){const x=document.querySelector('#loginMsg');x.textContent=t;x.className='message '+c}async function enter(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)return msg(d.error);token=d.token;login.hidden=true;panel.hidden=false;load()}async function load(){const r=await fetch('/api/admin/appointments',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)return;const a=d.appointments.sort((x,y)=>(x.date+x.start).localeCompare(y.date+y.start));box.innerHTML=a.length?'':'<p class="empty">No hay citas registradas todavía.</p>';a.forEach(x=>{const el=document.createElement('article');el.className='appointment';el.innerHTML='<div><strong>'+x.date+'</strong><span>'+x.label+'</span></div><div><b>'+x.name+'</b><span>Tel: '+x.phone+'</span><span>Motivo: '+x.reason+'</span></div><button data-id="'+x.id+'">Eliminar</button>';el.querySelector('button').onclick=async()=>{if(confirm('¿Eliminar esta cita?')){await fetch('/api/admin/appointments/'+x.id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});load()}};box.appendChild(el)})}document.querySelector('#loginBtn').onclick=enter;document.querySelector('#password').onkeydown=e=>{if(e.key==='Enter')enter()};document.querySelector('#refresh').onclick=load;
</script></body></html>
